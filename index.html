<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Twitch Pixel Texture GIF Generator</title>
  <style>
    body {
      background: #0e0e10;
      color: #efeff1;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #26262c;
      width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h2 {
      margin: 0 0 16px 0;
      color: #a970ff;
      text-align: center;
      font-size: 20px;
    }
    .previews {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .preview-box {
      background: #0f0e11;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a3a44;
      text-align: center;
    }
    .preview-box label {
      font-size: 11px;
      color: #adadb8;
      margin-bottom: 6px;
      display: block;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 4px;
      background: #000;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .full {
      grid-column: span 3;
    }
    .span-2 {
      grid-column: span 2;
    }
    label {
      font-size: 11px;
      color: #adadb8;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    .color-input-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    input[type="text"], select {
      width: 100%;
      background: #0f0e11;
      border: 1px solid #3a3a44;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      font-size: 12px;
    }
    input[type="text"]:focus {
      border-color: #a970ff;
    }
    input[type="color"] {
      width: 36px;
      height: 34px;
      border: none;
      background: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    input[type="color"]:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #a970ff;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    button {
      margin-top: 8px;
      background: #9146ff;
      color: #fff;
      border: none;
      padding: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
    }
    button:hover {
      background: #772ce8;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>👾 Пиксельная Текстура GIF</h2>

    <div class="previews">
      <div class="preview-box">
        <label>Текстура (GIF 256x256)</label>
        <canvas id="texCanvas" width="150" height="150"></canvas>
      </div>
      <div class="preview-box" style="flex: 1;">
        <label>Тест на тексте</label>
        <canvas id="textCanvas" width="240" height="150"></canvas>
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Цвет 1 (База)</label>
        <div class="color-input-group">
          <input type="text" id="color1Text" value="#1c400e">
          <input type="color" id="baseColor" value="#1c400e">
        </div>
      </div>

      <div>
        <label>Цвет 2 (Середина)</label>
        <div class="color-input-group">
          <input type="text" id="color2Text" value="#7be322">
          <input type="color" id="shineColor" value="#7be322">
        </div>
      </div>

      <div>
        <label class="checkbox-label">
          <input type="checkbox" id="useThirdColor" checked>
          <span>+ Цвет 3</span>
        </label>
        <div class="color-input-group">
          <input type="text" id="color3Text" value="#ffffff">
          <input type="color" id="thirdColor" value="#ffffff">
        </div>
      </div>

      <div>
        <label>Размер пикселя</label>
        <input type="range" id="pixelSize" min="4" max="24" value="8" step="2">
      </div>

      <div>
        <label>Ширина / Плотность</label>
        <input type="range" id="shineWidth" min="2" max="16" value="6" step="1">
      </div>

      <div>
        <label>Скорость</label>
        <input type="range" id="speed" min="1" max="8" value="3">
      </div>

      <div class="span-2">
        <label>Тип узора</label>
        <select id="patternType">
          <option value="smooth_sparkle">Плавные пиксельные искры</option>
          <option value="sparkle">Резкие искры / Стробоскоп</option>
          <option value="diagonal">Диагональная волна</option>
          <option value="horizontal">Горизонтальный перелив</option>
        </select>
      </div>

      <div>
        <label>Плавность переливала</label>
        <input type="range" id="smoothness" min="1" max="10" value="5">
      </div>

      <div>
        <label>Размер ника</label>
        <input type="range" id="fontSize" min="20" max="42" value="32">
      </div>

      <div class="span-2">
        <label>Тестовый никнейм</label>
        <input type="text" id="textInput" value="Alisa">
      </div>

      <button id="downloadBtn" class="full">🟣 Скачать GIF-текстуру (256x256)</button>
    </div>
  </div>

  <script>
    const texCanvas = document.getElementById('texCanvas');
    const texCtx = texCanvas.getContext('2d');

    const textCanvas = document.getElementById('textCanvas');
    const textCtx = textCanvas.getContext('2d');

    const baseColorInput = document.getElementById('baseColor');
    const shineColorInput = document.getElementById('shineColor');
    const thirdColorInput = document.getElementById('thirdColor');
    const useThirdColorInput = document.getElementById('useThirdColor');

    const color1Text = document.getElementById('color1Text');
    const color2Text = document.getElementById('color2Text');
    const color3Text = document.getElementById('color3Text');

    const pixelSizeInput = document.getElementById('pixelSize');
    const shineWidthInput = document.getElementById('shineWidth');
    const patternTypeInput = document.getElementById('patternType');
    const speedInput = document.getElementById('speed');
    const smoothnessInput = document.getElementById('smoothness');
    const fontSizeInput = document.getElementById('fontSize');
    const textInput = document.getElementById('textInput');
    const downloadBtn = document.getElementById('downloadBtn');

    const bufferCanvas = document.createElement('canvas');
    bufferCanvas.width = 256;
    bufferCanvas.height = 256;
    const bufferCtx = bufferCanvas.getContext('2d');

    let animProgress = 0;

    useThirdColorInput.addEventListener('change', () => {
      const active = useThirdColorInput.checked;
      thirdColorInput.disabled = !active;
      color3Text.disabled = !active;
    });

    // Универсальный парсер любого текстового цвета в HEX
    function parseColorToHex(str) {
      if (!str) return null;
      str = str.trim();

      // Проверка на 3 чистых числа (например: 249, 105, 177 или 249 105 177)
      const rawNums = str.match(/^\(?\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})\s*\)?$/);
      if (rawNums) {
        const r = Math.min(255, parseInt(rawNums[1])).toString(16).padStart(2, '0');
        const g = Math.min(255, parseInt(rawNums[2])).toString(16).padStart(2, '0');
        const b = Math.min(255, parseInt(rawNums[3])).toString(16).padStart(2, '0');
        return `#${r}${g}${b}`;
      }

      // Если введён стандартный CSS цвет (rgb, hsl, hex)
      const dummyCtx = document.createElement('canvas').getContext('2d');
      dummyCtx.fillStyle = '#000000';
      dummyCtx.fillStyle = str;
      const computed = dummyCtx.fillStyle;

      if (computed.startsWith('#') && computed !== '#000000') return computed;
      if (str.toLowerCase() === 'black' || str === '#000000' || str === '#000') return '#000000';

      const rgbMatch = computed.match(/\d+/g);
      if (rgbMatch && rgbMatch.length >= 3) {
        const r = parseInt(rgbMatch[0]).toString(16).padStart(2, '0');
        const g = parseInt(rgbMatch[1]).toString(16).padStart(2, '0');
        const b = parseInt(rgbMatch[2]).toString(16).padStart(2, '0');
        return `#${r}${g}${b}`;
      }
      return null;
    }

    function setupColorSync(textEl, pickerEl) {
      textEl.addEventListener('input', () => {
        const parsed = parseColorToHex(textEl.value);
        if (parsed) {
          pickerEl.value = parsed;
        }
      });
      pickerEl.addEventListener('input', () => {
        textEl.value = pickerEl.value;
      });
    }

    setupColorSync(color1Text, baseColorInput);
    setupColorSync(color2Text, shineColorInput);
    setupColorSync(color3Text, thirdColorInput);

    function hexToRgb(hex) {
      const num = parseInt(hex.replace('#', ''), 16);
      return [ (num >> 16) & 255, (num >> 8) & 255, num & 255 ];
    }

    function lerpColor(c1, c2, t) {
      t = Math.max(0, Math.min(1, t));
      const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
      const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
      const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
      return `rgb(${r},${g},${b})`;
    }

    function getPixelColor(factor) {
      factor = Math.max(0, Math.min(1, factor));
      const cBase = hexToRgb(baseColorInput.value);
      const cShine = hexToRgb(shineColorInput.value);

      if (!useThirdColorInput.checked) {
        return lerpColor(cBase, cShine, factor);
      } else {
        const cThird = hexToRgb(thirdColorInput.value);
        if (factor <= 0.5) {
          return lerpColor(cBase, cShine, factor * 2);
        } else {
          return lerpColor(cShine, cThird, (factor - 0.5) * 2);
        }
      }
    }

    function renderTexture(progress) {
      const size = 256;
      const pSize = parseInt(pixelSizeInput.value);
      const cols = size / pSize;
      const rows = size / pSize;

      const shineW = parseInt(shineWidthInput.value);
      const pattern = patternTypeInput.value;
      const smoothVal = parseInt(smoothnessInput.value);

      bufferCtx.fillStyle = baseColorInput.value;
      bufferCtx.fillRect(0, 0, size, size);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let factor = 0;

          if (pattern === 'diagonal') {
            const diagPos = (c + r) % cols;
            const wave = (progress * cols) % cols;
            let dist = Math.abs(diagPos - wave);
            if (dist > cols / 2) dist = cols - dist;
            factor = 1 - (dist / (shineW / 2));
            if (factor > 0) {
              factor = Math.pow(factor, (11 - smoothVal) * 0.3);
            }
          } 
          else if (pattern === 'horizontal') {
            const wave = (progress * cols) % cols;
            let dist = Math.abs(c - wave);
            if (dist > cols / 2) dist = cols - dist;
            factor = 1 - (dist / (shineW / 2));
            if (factor > 0) {
              factor = Math.pow(factor, (11 - smoothVal) * 0.3);
            }
          } 
          else if (pattern === 'sparkle') {
            const seed = Math.sin(c * 12.9898 + r * 78.233 + Math.floor(progress * 10)) * 43758.5453;
            const rnd = seed - Math.floor(seed);
            if (rnd > 0.4) {
              factor = (rnd - 0.4) / 0.6;
            }
          }
          else if (pattern === 'smooth_sparkle') {
            // Уникальная псевдослучайная фаза и скорость для каждого пикселя
            const seed = Math.sin(c * 12.9898 + r * 78.233) * 43758.5453;
            const phase = (seed - Math.floor(seed)) * Math.PI * 2;
            const k = 1 + (Math.floor(seed * 10) % 2); // 1 или 2 цикла для бесшовного зацикливания

            // Плавное пульсирование конкретного пикселя без размытия соседей
            let val = (Math.sin(progress * Math.PI * 2 * k + phase) + 1) / 2;

            const gamma = Math.exp((5 - smoothVal) * 0.3);
            factor = Math.pow(val, gamma);
          }

          if (factor > 0) {
            bufferCtx.fillStyle = getPixelColor(factor);
            bufferCtx.fillRect(c * pSize, r * pSize, pSize, pSize);
          }
        }
      }

      texCtx.clearRect(0, 0, texCanvas.width, texCanvas.height);
      texCtx.drawImage(bufferCanvas, 0, 0, texCanvas.width, texCanvas.height);

      textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);

      textCtx.save();
      textCtx.font = `900 ${fontSizeInput.value}px Impact, sans-serif`;
      textCtx.textAlign = 'center';
      textCtx.textBaseline = 'middle';

      const nick = textInput.value || 'NICK';
      textCtx.fillStyle = '#ffffff';
      textCtx.fillText(nick, textCanvas.width / 2, textCanvas.height / 2);

      textCtx.globalCompositeOperation = 'source-in';
      const patternGrad = textCtx.createPattern(bufferCanvas, 'repeat');
      textCtx.fillStyle = patternGrad;
      textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);

      textCtx.globalCompositeOperation = 'destination-over';
      textCtx.fillStyle = '#0f0e11';
      textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);

      textCtx.restore();
    }

    function animate() {
      const spd = parseInt(speedInput.value) * 0.005;
      animProgress = (animProgress + spd) % 1.0;
      renderTexture(animProgress);
      requestAnimationFrame(animate);
    }

    animate();

    downloadBtn.addEventListener('click', () => {
    downloadBtn.innerText = '⌛ Рендеринг GIF...';
    downloadBtn.disabled = true;

    const frames = [];
    const totalFrames = 24;
    
    // Берем скорость из ползунка и рассчитываем задержку кадров (interval)
    const speedVal = parseInt(speedInput.value);
    // Чем выше скорость, тем меньше задержка (минимально 0.02s для плавностей)
    const frameInterval = Math.max(0.02, Number((0.15 / speedVal).toFixed(3)));

    for (let i = 0; i < totalFrames; i++) {
      renderTexture(i / totalFrames);
      frames.push(bufferCanvas.toDataURL('image/png'));
    }

    gifshot.createGIF({
      images: frames,
      gifWidth: 256,
      gifHeight: 256,
      interval: frameInterval,
      numFrames: totalFrames
    }, function(obj) {
      if (!obj.error) {
        const a = document.createElement('a');
        a.href = obj.image;
        a.download = `pixel_texture_256x256.gif`;
        a.click();
      }
      downloadBtn.innerText = '🟣 Скачать GIF-текстуру (256x256)';
      downloadBtn.disabled = false;
    });
  });
  </script>
</body>
</html>
